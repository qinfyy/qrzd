syntax = "proto3";

package Sv.Database;

// 玩家基础信息
message PlayerProfileComp {
    int64 create_time = 1;
    string nick_name = 2;
    int32 level = 3;
    int32 role_id = 4;
    string avatar_id = 5;
    int32 server_id = 6;
    int32 money = 7;
    int32 crystal = 8;
    int32 experience = 9;
    int32 summon_coin = 10;
}

// 周目与天数
message WeekNumComp {
    int32 week = 1;
    int32 day = 2;
    repeated DailySettlement settlements = 3;
    int32 ending_id = 4;
    bool chapter_pending = 5;
    string score_json = 6;
    string ending_reward_json = 7;
}

message DailySettlement {
    int32 week = 1;
    int32 day = 2;
    bool acknowledged = 3;
    string snapshot_json = 4;
}

// 玩家状态（主城、战斗等）
message StatusComp {
    string current_status = 1;
    bool emergency = 2;
}

// 城市与建设数值
message CityComp {
    int32 action_val = 1;
    int32 develop_val = 2;
    int32 develop_val_count = 3;
    int32 build_fund = 4;
    int32 fatigue_val = 5;
    int32 event_val = 6;
    int32 research_val = 7;
    int32 patrol_num = 8;
    repeated AreaState areas = 9;
    int32 daily_consumed_action = 10;
    int32 total_actions = 11;
    int32 total_patrols = 12;
    int32 total_builds = 13;
    int32 total_develops = 14;
    int32 patrol_area = 15;
    repeated int32 patrol_heroes = 16;
    bool newbee_patrol_complete = 17;
    bool ended_actions = 18;
    map<int32, int32> blackcores = 19;
    repeated int32 hidden_buildings = 20;
    int32 center_confidence = 21;
    repeated int32 passed_stages = 22;
    // 深夜食堂每日只能用餐一次，跨日由 CityLogic.NewDay 清零。
    bool use_canteen = 23;
}

message AreaState {
    int32 id = 1;
    int32 status = 2;
    bool cr = 3;
    bool lock = 4;
    int32 level = 5;
    int32 max_building_num = 6;
    int32 current_stage = 7;
    repeated BuildingState buildings = 8;
    int32 research_val = 9;
    int32 force_val = 10;
    int32 develop_val = 11;
    repeated int32 stage_ids = 12;
    int32 patrol_count = 13;
    bool patrol_lock = 14;
}

message BuildingState {
    int32 slot = 1;
    int32 building_id = 2;
    string uuid = 3;
}


// 背包与道具
message InventoryComp {
    int32 max_cost = 1;
    repeated ItemState items = 2;
}

message ItemState {
    string uuid = 1;
    int32 item_id = 2;
    int32 count = 3;
    string treasure_json = 4;
}

// 神器使管理器
message HeroMgrComp {
    repeated HeroState heroes = 1;
    map<int32, int32> banned_heroes = 2;
    repeated int32 cine_locked_heroes = 3;
    // 影装实例池，对应管理器级别的影装库存。
    repeated TreasureInstance treasures = 4;
    // 皮肤实例池，供各角色按 UUID 引用。
    repeated SkinInstance skins = 8;
    // 好感锁定名单，对应 fl。
    repeated int32 friendly_locked_heroes = 5;
    // 尚未归属到已拥有神器使的皮肤暂存，对应 ps。
    map<int32, string> pending_skins = 6;
    // 尚未归属到已拥有神器使的挂饰暂存，对应 pp。
    map<int32, string> pending_pendants = 7;
}

message HeroState {
    int32 hero_id = 1;
    int32 star_level = 2;
    int32 star_order = 3;
    int32 fatigue = 4;
    int32 friendly = 5;
    // 是否已开启神器。满星后仍需一次 incHeroStarOrder 才能开启，不能在升星时自动打开。
    bool open_artifact = 6;
    // 神器等级，对应客户端 ar.o。
    int32 artifact_level = 7;
    // 神器增幅等级，对应 ar.il。
    int32 artifact_inc_level = 8;
    // 已分配的神器属性点，对应 ar.oa，键为属性名。
    map<string, int32> artifact_attrs = 9;
    // 觉醒阶段，对应 as。
    int32 awake_stage = 10;
    // 觉醒外观开关，对应 ass。
    bool awake_skin_style = 11;
    // 解放阶段，对应 ls。
    int32 liberate_stage = 12;
    // 解放各分支累计经验，对应 la/ld/lh。
    map<string, int32> liberate_exp = 13;
    // 影装 COST 上限，对应 ti.mc。会随养成增长，不能固定为 25。
    int32 treasure_max_cost = 14;
    // 已装备影装：UUID -> 来源 invId。
    map<string, int32> equipped_treasures = 15;
    // 持有的皮肤 UUID 列表，对应 sk。
    repeated string skin_uuids = 16;
    // 当前使用的皮肤 UUID，对应 cs。
    string current_skin_uuid = 17;
    // 挂饰：外层是槽位，内层是挂饰 UUID，对应 wpa。
    repeated string pendant_uuids = 18;
    // 羁绊影装引用，对应 jbt。
    repeated string bond_treasure_uuids = 19;
    // 本周已攻略，对应 cfd。
    bool conquered_this_week = 20;
    // 永久已攻略，对应 fd。
    bool conquered = 21;
    // 获得时间，对应 at。
    int64 obtain_time = 22;
}

// 影装实例。同一件影装可被多个神器使引用，因此独立于 HeroState 保存，
// 由 equipped_treasures 的 UUID 指向，避免复制出多份可独立升级的同一资产。
message TreasureInstance {
    string uuid = 1;
    int32 item_id = 2;
    int32 level = 3;
    int32 star = 4;
    int32 rarity = 5;
    bool exclusive = 6;
    int32 exclusive_stage = 7;
    map<string, int32> attrs = 8;
    int64 obtain_time = 9;
}

// 皮肤实例。客户端 HeroData.initFromDict 会把 sk 的每个值交给 SkinData.initFromDict，
// 该方法要求 i(皮肤资源 ID) 与 u(UUID) 都存在，缺一个就会抛异常并中断整个登录流程，
// 因此不能只存 UUID，必须连同皮肤 ID 一起持久化。
message SkinInstance {
    string uuid = 1;
    int32 skin_id = 2;
    int64 create_time = 3;
    // 染色方案键值，键为染色位，值为配置 ID。
    map<string, int32> cur_dye = 4;
    map<string, int32> pending_dye = 5;
    // 染色生效时间，对应 dst。
    int64 dye_set_time = 6;
}

// 社交数据
message SocialComp {
    repeated StoryMessage private_messages = 1;
    repeated StoryMessage terminal_messages = 2;
}

message StoryMessage {
    int32 id = 1;
    bool read = 2;
    int32 selected_option = 3;
    bool complete = 4;
    int64 received_at = 5;
}

// 情报数据
message IntelligenceComp {
    bool readed = 1;
    repeated IntelligenceState entries = 2;
    int32 generated_day = 3;
    int32 ended_day = 4;
}

message IntelligenceState {
    int32 id = 1;
    int32 state = 2;
    int32 day = 3;
    string uuid = 4;
    bool opened = 5;
    int32 handled_day = 6;
    repeated IntelligenceEffect effects = 7;
}

message IntelligenceEffect {
    int32 id = 1;
    string uuid = 2;
    int32 day = 3;
    int32 area = 4;
    int32 building = 5;
    int32 hero = 6;
    string reward_json = 7;
}

message StoryComp {
    string route = 1;
    repeated int32 cgs = 2;
    repeated int32 endings = 3;
    repeated int32 notepads = 4;
    repeated string clicked_routes = 5;
    int32 place = 6;
    int32 general_value = 7;
    bool client_event_finish = 8;
    repeated int32 unlocked_buildings = 9;
    map<int32, string> area_exclam_json = 10;
    repeated int32 current_cgs = 11;
}

message EventTriggerComp {
    repeated int32 completed_events = 1;
    repeated EventProgress processing_events = 2;
    repeated int32 queued_events = 3;
    repeated int32 locked_events = 4;
    repeated EventChoice choices = 5;
    map<int32, int32> completion_actions = 6;
    map<int32, int32> completion_days = 7;
    string clicked_area = 8;
    repeated int32 client_operations = 9;
    repeated int32 battle_completions = 10;
}

message EventProgress {
    int32 event_id = 1;
    repeated int32 dialogs = 2;
    repeated int32 battles = 3;
    repeated string ui = 4;
    int32 started_day = 5;
}

message EventChoice {
    int32 event_id = 1;
    int32 selected_event = 2;
    int32 option = 3;
    int32 day = 4;
}

message NewbeeComp {
    repeated int32 finished = 1;
    repeated int32 processing = 2;
    bool init_prologue = 3;
    bool tutorial_began = 4;
    bool summon_claimed = 5;
    bool summon_open = 6;
    int32 summon_hero = 7;
    bool introduction_skipped = 8;
}

message CombatComp {
    CombatInstance active = 1;
    repeated CombatInstance settled = 2;
}

message CombatInstance {
    string id = 1;
    int32 type = 2;
    int32 stage = 3;
    repeated int32 heroes = 4;
    repeated int32 extra_heroes = 5;
    int32 pending_hero = 6;
    int32 week = 7;
    int32 day = 8;
    int64 entered_at = 9;
    int32 state = 10;
    int32 win = 11;
    string reward_json = 12;
    string entry_json = 13;
    bool temporary_heroes = 14;
    int32 event_id = 15;
    int32 action_cost = 16;
    int32 fatigue_cost = 17;
    int32 area = 18;
}

message RpcComp {
    int32 max_sequence = 1;
    repeated RpcReceipt receipts = 2;
}

message RpcReceipt {
    int32 sequence = 1;
    string method = 2;
    bytes request = 3;
    repeated RpcReply replies = 4;
}

message RpcReply {
    string method = 1;
    bytes parameters = 2;
}

// 玩家持久化存档聚合根
message PlayerSaveData {
    PlayerProfileComp profile_comp = 1;
    WeekNumComp week_num_comp = 2;
    StatusComp status_comp = 3;
    CityComp city_comp = 4;
    InventoryComp inventory_comp = 5;
    HeroMgrComp hero_mgr_comp = 6;
    SocialComp social_comp = 7;
    IntelligenceComp intelligence_comp = 8;
    StoryComp story_comp = 9;
    EventTriggerComp event_trigger_comp = 10;
    NewbeeComp newbee_comp = 11;
    CombatComp combat_comp = 12;
    RpcComp rpc_comp = 13;
}
